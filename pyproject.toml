[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scoim"
version = "0.2.0"
description = "Scripted co-creation of impromptu music with humans and language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonpatch==1.33",
    "jsonpointer==3.1.1",
    "jsonschema==4.26.0",
    "mido==1.3.3",
    "rfc8785==0.1.4",
]

[project.urls]
Homepage = "https://github.com/AllegroMoltoV/scoim"
Repository = "https://github.com/AllegroMoltoV/scoim"
Issues = "https://github.com/AllegroMoltoV/scoim/issues"

[project.optional-dependencies]
dev = [
    "build==1.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.2",
]

[project.scripts]
scoim = "scoim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["scoim*", "llm_musical_composer*"]
namespaces = false

[tool.setuptools.package-data]
scoim = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["scoim"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
